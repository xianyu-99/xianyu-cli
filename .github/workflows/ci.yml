name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    name: Maven smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests
        run: mvn -B test

      - name: Package without tests
        run: mvn -B -DskipTests package
